<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国家队持仓监控周报 · 跳转中</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { text-align: center; color: #6b7280; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .link { color: #1677ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p>正在跳转到最新报告…</p>
    <p style="font-size:13px;opacity:0.7">如果没有自动跳转，<a class="link" id="manual" href="#">点这里</a></p>
  </div>
  <script>
    (function() {
      var fallback = 'national-team-holdings-monitor-2026-08-08.html';
      function withBust(file, data) {
        var bust = encodeURIComponent((data && data.updated) || file);
        return file + '?v=' + bust;
      }
      // Fetch JSON, then redirect to the latest file（no-store 避免 Chrome 命中旧缓存）
      fetch('national-team-holdings-latest.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          window.location.replace(withBust(data.latest || fallback, data));
        })
        .catch(function() {
          window.location.replace(fallback);
        });
      document.getElementById('manual').addEventListener('click', function(e) {
        e.preventDefault();
        fetch('national-team-holdings-latest.json', { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            window.location.href = withBust(data.latest || fallback, data);
          })
          .catch(function() { window.location.href = fallback; });
      });
    })();
  </script>
</body>
</html>
